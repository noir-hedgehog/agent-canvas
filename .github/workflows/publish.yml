name: Validate and publish Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:demo
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Package and test extracted local release
        run: |
          npm run package:local
          mkdir /tmp/ac-local-release
          tar -xzf release/agentcanvas-0.1.0-local.tar.gz -C /tmp/ac-local-release
          npm ci --omit=dev --prefix /tmp/ac-local-release/agentcanvas-0.1.0-local
          node scripts/smoke-release.mjs /tmp/ac-local-release/agentcanvas-0.1.0-local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            test-results/
            playwright-report/
      - uses: actions/upload-artifact@v4
        with:
          name: local-release
          path: |
            release/*.tar.gz
            release/*.zip
            release/SHA256SUMS.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
